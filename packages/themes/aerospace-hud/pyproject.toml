[project]
name = "presentation-md-theme-aerospace-hud"
version = "1.0.0"
description = "Aerospace HUD presentation theme — navy, cyan instruments, warning orange."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_aerospace_hud"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_aerospace_hud/theme.json"
