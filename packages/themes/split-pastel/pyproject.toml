[project]
name = "presentation-md-theme-split-pastel"
version = "1.0.0"
description = "Split Pastel — peach/lavender vertical split, Outfit, playful badges."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_split_pastel"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_split_pastel/theme.json"
