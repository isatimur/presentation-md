[project]
name = "presentation-md-theme-long-table"
version = "1.0.0"
description = "Warm cream and rust-red supper-club aesthetic with Bricolage + Fraunces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_long_table"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_long_table/theme.json"
