[project]
name = "presentation-md-theme-soft-editorial"
version = "1.0.0"
description = "Soft Editorial — Cormorant Garamond on warm cream paper with sage, blush, lemon, and lilac accents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_soft_editorial"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_soft_editorial/theme.json"
