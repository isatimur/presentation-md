[project]
name = "presentation-md-theme-ft-editorial"
version = "1.0.0"
description = "FT-inspired editorial presentation theme — cream paper, ink serif, blue rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_ft_editorial"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_ft_editorial/theme.json"
