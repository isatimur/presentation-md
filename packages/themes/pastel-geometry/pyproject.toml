[project]
name = "presentation-md-theme-pastel-geometry"
version = "1.0.0"
description = "Pastel Geometry — Plus Jakarta Sans on sky pastel with vertical edge pills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_pastel_geometry"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_pastel_geometry/theme.json"
