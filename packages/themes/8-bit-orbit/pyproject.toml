[project]
name = "presentation-md-theme-8-bit-orbit"
version = "1.0.0"
description = "Pixel neon arcade on a deep navy void."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_bit_orbit"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_bit_orbit/theme.json"
