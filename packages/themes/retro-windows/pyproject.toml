[project]
name = "presentation-md-theme-retro-windows"
version = "1.0.0"
description = "Windows 95 chrome: gray bevels, navy title bars, pixel nostalgia."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_retro_windows"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_retro_windows/theme.json"
