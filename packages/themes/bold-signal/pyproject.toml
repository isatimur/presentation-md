[project]
name = "presentation-md-theme-bold-signal"
version = "1.0.0"
description = "Bold Signal — Archivo Black on dark gradient with vibrant orange card focal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_bold_signal"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_bold_signal/theme.json"
