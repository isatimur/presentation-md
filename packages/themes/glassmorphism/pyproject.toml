[project]
name = "presentation-md-theme-glassmorphism"
version = "1.0.0"
description = "Glassmorphism theme — icy mist, indigo + cyan, soft glass cards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_glassmorphism"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_glassmorphism/theme.json"
