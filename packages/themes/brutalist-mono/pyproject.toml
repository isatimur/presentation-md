[project]
name = "presentation-md-theme-brutalist-mono"
version = "0.1.0"
description = "Raw brutalist theme — concrete-grey background, monospace type, hard corners, hazard-orange accent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_brutalist_mono"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_brutalist_mono/theme.json"
