[project]
name = "presentation-md-theme-neon-noir"
version = "1.0.0"
description = "Neon noir theme — wet asphalt night, magenta + cyan neon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_neon_noir"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_neon_noir/theme.json"
