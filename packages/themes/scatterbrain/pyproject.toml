[project]
name = "presentation-md-theme-scatterbrain"
version = "1.0.0"
description = "Post-it sticky notes on cork/cream with Shrikhand + Caveat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_scatterbrain"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_scatterbrain/theme.json"
