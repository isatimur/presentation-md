[project]
name = "presentation-md-theme-heritage-editorial"
version = "1.0.2"
description = "Heritage editorial theme — parchment, terracotta, Playfair serif."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_heritage_editorial"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_heritage_editorial/theme.json"
