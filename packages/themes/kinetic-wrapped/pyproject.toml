[project]
name = "presentation-md-theme-kinetic-wrapped"
version = "1.0.0"
description = "Kinetic Wrapped theme — black + acid lime, Archivo Black."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_kinetic_wrapped"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_kinetic_wrapped/theme.json"
