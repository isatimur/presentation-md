[project]
name = "presentation-md-theme-pin-and-paper"
version = "1.0.2"
description = "Pin & Paper — yellow legal-pad field with cobalt ink, Space Grotesk + Caveat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_pin_and_paper"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_pin_and_paper/theme.json"
