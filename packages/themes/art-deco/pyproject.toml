[project]
name = "presentation-md-theme-art-deco"
version = "1.0.0"
description = "Art Deco theme — emerald, gold leaf, Cinzel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_art_deco"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_art_deco/theme.json"
