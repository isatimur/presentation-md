[project]
name = "presentation-md-theme-notebook-tabs"
version = "1.0.1"
description = "Notebook Tabs — cream paper card on dark with mint/lavender/pink tabs, Bodoni Moda."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_notebook_tabs"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_notebook_tabs/theme.json"
