[project]
name = "presentation-md-theme-swiss-typographic"
version = "1.0.0"
description = "Swiss typographic theme — white grid, signal red, bold grotesk, zero radius."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_swiss_typographic"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_swiss_typographic/theme.json"
