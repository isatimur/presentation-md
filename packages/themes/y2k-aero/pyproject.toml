[project]
name = "presentation-md-theme-y2k-aero"
version = "1.0.0"
description = "Y2K aero theme — icy gradients, chrome cyan, soft bubbles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_y2k_aero"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_y2k_aero/theme.json"
