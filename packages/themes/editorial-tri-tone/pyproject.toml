[project]
name = "presentation-md-theme-editorial-tri-tone"
version = "1.0.0"
description = "Editorial Tri-Tone — blush pink, golden butter, burgundy wine; Bricolage Grotesque + Instrument Serif."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_editorial_tri_tone"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_editorial_tri_tone/theme.json"
