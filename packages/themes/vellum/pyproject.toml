[project]
name = "presentation-md-theme-vellum"
version = "1.0.2"
description = "Vellum — deep periwinkle field with chartreuse italic Cormorant type."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_vellum"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_vellum/theme.json"
