[project]
name = "presentation-md-theme-grove"
version = "1.0.0"
description = "Forest-green canvas with cream type, classical Playfair serifs, rust accent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_grove"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_grove/theme.json"
