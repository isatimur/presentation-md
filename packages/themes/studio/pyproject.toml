[project]
name = "presentation-md-theme-studio"
version = "1.0.0"
description = "Black canvas with electric-yellow type; high-voltage design studio aesthetic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_studio"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_studio/theme.json"
