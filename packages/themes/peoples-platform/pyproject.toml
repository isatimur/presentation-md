[project]
name = "presentation-md-theme-peoples-platform"
version = "1.0.0"
description = "Activist poster energy: cobalt, amber, red shadows on cream."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_peoples_platform"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_peoples_platform/theme.json"
