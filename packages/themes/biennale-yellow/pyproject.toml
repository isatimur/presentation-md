[project]
name = "presentation-md-theme-biennale-yellow"
version = "1.0.0"
description = "Biennale Yellow — Instrument Serif on parchment with solar yellow bloom and deep indigo ink."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_biennale_yellow"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_biennale_yellow/theme.json"
