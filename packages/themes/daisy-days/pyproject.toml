[project]
name = "presentation-md-theme-daisy-days"
version = "1.0.0"
description = "Cheerful pastel deck with hand-drawn daisies, stars, and rainbows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_daisy_days"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_daisy_days/theme.json"
