[project]
name = "presentation-md-theme-broadsheet"
version = "1.0.2"
description = "Newspaper broadsheet theme — newsprint, ink, Playfair + Lora."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_broadsheet"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_broadsheet/theme.json"
