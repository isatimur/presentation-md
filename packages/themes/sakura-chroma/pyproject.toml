[project]
name = "presentation-md-theme-sakura-chroma"
version = "1.0.0"
description = "Vintage Japanese cassette package — cream, rainbow stamps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_sakura_chroma"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_sakura_chroma/theme.json"
