[project]
name = "presentation-md-theme-pastel-dreamy"
version = "0.1.0"
description = "Soft pastel theme — lavender-blush background, deep plum text, blush/periwinkle accent pair."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_pastel_dreamy"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_pastel_dreamy/theme.json"
