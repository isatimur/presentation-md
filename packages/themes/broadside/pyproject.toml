[project]
name = "presentation-md-theme-broadside"
version = "1.0.0"
description = "Broadside — dark editorial canvas with fire-orange accent and massive Barlow type."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_broadside"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_broadside/theme.json"
