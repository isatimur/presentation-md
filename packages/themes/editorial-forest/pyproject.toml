[project]
name = "presentation-md-theme-editorial-forest"
version = "1.0.0"
description = "Editorial Forest — Source Serif 4 on oat-cream with forest green and dusty rose."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_editorial_forest"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_editorial_forest/theme.json"
