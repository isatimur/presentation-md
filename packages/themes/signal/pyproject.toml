[project]
name = "presentation-md-theme-signal"
version = "1.0.0"
description = "Signal — dual cream/navy editorial with antique gold accent, Source Serif 4."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_signal"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_signal/theme.json"
