[project]
name = "presentation-md-theme-fintech-clean"
version = "1.0.0"
description = "Fintech clean theme — white, violet + mint, Inter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_fintech_clean"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_fintech_clean/theme.json"
