[project]
name = "presentation-md-theme-developer-dark"
version = "1.0.0"
description = "Developer dark theme — GitHub night, green + blue, JetBrains Mono."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_developer_dark"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_developer_dark/theme.json"
