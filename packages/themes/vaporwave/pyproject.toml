[project]
name = "presentation-md-theme-vaporwave"
version = "1.0.0"
description = "Vaporwave theme — purple dusk, pink sunset, teal chrome grid."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_vaporwave"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_vaporwave/theme.json"
