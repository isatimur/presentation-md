[project]
name = "presentation-md-theme-pink-script"
version = "1.0.0"
description = "Nocturnal couture — black canvas, hot pink, DM Serif Display."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_pink_script"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_pink_script/theme.json"
