[project]
name = "presentation-md-theme-creative-mode"
version = "1.0.0"
description = "Creative Mode — cream canvas, hard ink borders, forest/pink/orange/yellow blocks, Archivo Black."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_creative_mode"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_creative_mode/theme.json"
