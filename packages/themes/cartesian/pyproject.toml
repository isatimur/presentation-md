[project]
name = "presentation-md-theme-cartesian"
version = "1.0.0"
description = "Quiet warm-neutral palette with classical Playfair serifs; tasteful and unhurried."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_cartesian"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_cartesian/theme.json"
