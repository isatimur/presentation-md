[project]
name = "presentation-md-theme-genz-bento"
version = "1.0.0"
description = "Gen-Z hard-shadow bento theme — coral + lime, thick ink borders, sticker energy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_genz_bento"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_genz_bento/theme.json"
