[project]
name = "presentation-md-theme-editorial-serif"
version = "0.1.0"
description = "Magazine-editorial theme — warm paper background, ink-black serif text, crimson masthead accent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_editorial_serif"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_editorial_serif/theme.json"
