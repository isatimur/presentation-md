[project]
name = "presentation-md-theme-bauhaus"
version = "1.0.0"
description = "Bauhaus presentation theme — cream field, primary red/blue, geometric blocks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_bauhaus"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_bauhaus/theme.json"
