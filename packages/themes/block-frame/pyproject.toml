[project]
name = "presentation-md-theme-block-frame"
version = "1.0.0"
description = "Neobrutalist pastel blocks with chunky black borders."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_block_frame"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_block_frame/theme.json"
