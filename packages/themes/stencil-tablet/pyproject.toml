[project]
name = "presentation-md-theme-stencil-tablet"
version = "1.0.0"
description = "Bone paper with stencil-cut headlines and a six-color earth palette."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_stencil_tablet"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_stencil_tablet/theme.json"
