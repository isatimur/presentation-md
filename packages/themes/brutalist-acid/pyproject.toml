[project]
name = "presentation-md-theme-brutalist-acid"
version = "1.0.0"
description = "Dark acid-brutalist theme — near-black, electric lime, monospace, hard edges."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_brutalist_acid"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_brutalist_acid/theme.json"
