[project]
name = "presentation-md-theme-aurora-glass"
version = "1.0.0"
description = "Dark aurora-glass presentation theme — void bg, frosted cards, violet + cyan glow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_aurora_glass"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_aurora_glass/theme.json"
