[project]
name = "presentation-md-theme-vintage-editorial"
version = "1.0.1"
description = "Vintage Editorial — Fraunces on cream with geometric accents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_vintage_editorial"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_vintage_editorial/theme.json"
