[project]
name = "presentation-md-theme-blue-professional"
version = "1.0.2"
description = "Cream paper with electric cobalt accents; clean modern professional."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_blue_professional"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_blue_professional/theme.json"
