[project]
name = "presentation-md-theme-crt-terminal"
version = "1.0.0"
description = "CRT phosphor terminal theme — acid green glow, scanlines, monospace only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_crt_terminal"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_crt_terminal/theme.json"
