[project]
name = "presentation-md-theme-neo-grid-bold"
version = "1.0.0"
description = "Neo-Grid Bold — putty ecru, ink black, electric lemon panels, Space Grotesk uppercase."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Timur Isachenko" }]
keywords = ["presentation-md", "theme", "ai-agent", "slides"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_md_theme_neo_grid_bold"]

[tool.hatch.build.targets.wheel.force-include]
"theme.json" = "presentation_md_theme_neo_grid_bold/theme.json"
