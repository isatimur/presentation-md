name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    # Version PRs from changesets/action only touch these paths. Skipping them
    # avoids github-actions[bot] pull_request runs that conclude action_required
    # with zero jobs (bot approval gate) and never exercise real code.
    paths-ignore:
      - ".changeset/**"
      - "**/CHANGELOG.md"
      - "**/package.json"
      - "**/pyproject.toml"

jobs:
  build-and-test:
    name: Build, test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: PPTX scorecard (all text editable in PowerPoint)
        run: pnpm scorecard --check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  python:
    name: Python tests (renderer + judge)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Renderer tests (source checkout)
        working-directory: packages/renderer-python
        run: uv run --python 3.11 --with pytest pytest -q

      - name: Judge script tests
        run: uv run --no-project --python 3.11 --with pytest pytest -q skills/deck-design-judge/scripts/tests
