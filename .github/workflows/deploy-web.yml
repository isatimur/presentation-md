name: Deploy web

# HARD CONSTRAINT (Hobby rate limits): do NOT auto-deploy on push.
# Verify locally (static `web/` + Studio vite / Playwright). Prod deploy is
# manual only via workflow_dispatch when quota allows.
# See CONTRIBUTING.md "Deploying the marketing site".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm a production Vercel deploy (uses Hobby quota)"
        required: true
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirm
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Refusing deploy — set confirm=deploy on workflow_dispatch."
          echo "Prefer local verify: pnpm --filter @presentation-md/studio test:e2e + static serve of web/"
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --global vercel@latest
      - name: Deploy to Vercel (prod)
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Single attempt — do not loop on 429; wait for Hobby quota reset.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
