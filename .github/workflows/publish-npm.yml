name: Publish to npm

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Changesets publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history needed so changesets can diff tags
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Create release PR or publish. Requires repo Setting
      # Actions → General → Workflow permissions:
      #   - Read and write permissions
      #   - Allow GitHub Actions to create and approve pull requests
      # See CONTRIBUTING.md "Changesets version PRs". Manual fallback:
      #   gh pr create --base main --head changeset-release/main --title "chore: version packages"
      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
